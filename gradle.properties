# A full build dexes the JVM Boson stack into the app and into each module's instrumented-test APK,
# in parallel; 4g runs out of memory doing so.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
